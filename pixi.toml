[workspace]
authors = ["Jamie R. Oaks <joaks1@gmail.com>"]
channels = ["conda-forge", "nodefaults"]
name = "comp-bio"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Default environment: the student-facing environment.
# Students run `pixi run start` from anywhere inside the repo.
# Keep this to what the notebooks might actually import.
# ---------------------------------------------------------------------------

[tasks]
start = { cmd = "marimo edit notebooks", description = "Open the class notebooks in marimo" }

[dependencies]
python = ">=3.14.0,<3.15"
git = ">=2.56.0,<3"
uv = ">=0.13.0,<0.14"

[pypi-dependencies]
marimo = ">=0.25.1, <0.26"
numpy = ">=2.5.4, <3"
scipy = ">=1.18.1, <2"
matplotlib = ">=3.11.2, <4"
biopython = ">=1.88, <2"
seaborn = ">=0.13.2, <0.14"
scikit-learn = ">=1.9.1, <2"
requests = ">=2.34.2, <3"
pandas = ">=3.0.6, <4"
plotly = ">=7.1.0, <8"
fsspec = ">=2026.9.0, <2027"

# ---------------------------------------------------------------------------
# dev feature: instructor tooling (R, Quarto, Jupyter, testing, etc.).
# Use with `pixi shell -e dev` or `pixi run -e dev <cmd>`.
# Restricted to linux-64 so students never have to solve or download it.
# ---------------------------------------------------------------------------

[feature.dev]
platforms = ["linux-64"]

[feature.dev.dependencies]
quarto = ">=1.9.38,<2"

[feature.dev.pypi-dependencies]
pytest = ">=9.1.1, <10"
ruff = ">=0.17.0, <0.18"
jupyter = ">=1.1.1, <2"

[environments]
dev = ["dev"]
