matplotlib = ">=3.11.2, <4"
seaborn = ">=0.13.2, <0.14"
scikit-learn = ">=1.9.1, <2"
requests = "*"
pandas = ">=3.0.6, <4"
pytest = ">=9.1.1, <10"
ruff = ">=0.16.9, <0.17"
