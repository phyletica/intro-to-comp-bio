[workspace]
authors = ["Jamie R. Oaks <joaks1@gmail.com>"]
channels = ["conda-forge", "nodefaults"]
name = "comp-bio"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
git = ">=2.56.0,<3"
python = ">=3.14.7,<3.15"
r-base = ">=4.5.3,<4.6"
